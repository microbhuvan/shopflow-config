
server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopflow_orders
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  cloud:
    open feign:
      client:
        config:
          default:
            connectTimeout: 2000 #allow 2seconds to establish connection
            readTimeout: 3000 #3 secs to wait for response


resilience4j:
  circuitbreaker:
    instances:
      userService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        withDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

      inventoryService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5 #evaluate upto 5 calls
        minimumNumberOfCalls: 3 #collect atleast 3 calls before calcuating failure rate
        failureRateThreshold: 50 #open the circuit when the failure rate reaches 50%
        waitDurationInOpenState: 10s #wait 10s before allowing trial calls
        permittedNumberOfCallsInHalfOpenState: 2
